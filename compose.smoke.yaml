# Safe Caddy-path smoke test. This overlay replaces the public port mappings
# with loopback-only high ports; it is not a production deployment topology.
services:
  caddy:
    ports: !override
      - "127.0.0.1:${SONG_EVAL_SMOKE_HTTP_PORT:-18080}:80"
      - "127.0.0.1:${SONG_EVAL_SMOKE_HTTPS_PORT:-18443}:443"
      - "127.0.0.1:${SONG_EVAL_SMOKE_HTTPS_PORT:-18443}:443/udp"
